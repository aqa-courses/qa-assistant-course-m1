# Тест-кейсы Shoplite. Сид для testcases_agent (SQLite) и playwright_agent.
# automated: true — есть автотест с тегом @id:<id> в файле test.
# Кейсы с automated: false — материал для генерации автотестов в модуле 4.

- id: 1
  title: Покупатель входит и попадает в каталог
  area: login
  priority: high
  steps:
    - Открыть /login
    - Ввести alice@example.com / password123, нажать «Войти»
  expected: Открыт каталог, в шапке имя «Алиса»
  automated: true
  test: autotests/tests/auth.spec.ts

- id: 2
  title: Неверный пароль — ошибка внутри формы
  area: login
  priority: high
  steps:
    - Открыть /login
    - Ввести alice@example.com и неверный пароль, нажать «Войти»
  expected: В форме «Неверный email или пароль», остаёмся на /login
  automated: true
  test: autotests/tests/auth.spec.ts

- id: 3
  title: Заблокированный пользователь не может войти
  area: login
  priority: medium
  steps:
    - Войти как locked@example.com / password123
  expected: В форме сообщение о блокировке учётной записи
  automated: true
  test: autotests/tests/auth.spec.ts

